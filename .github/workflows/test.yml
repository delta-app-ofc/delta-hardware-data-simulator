name: CI técnico

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tecnico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ci-tecnico
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compilar módulos Python
        run: python -m compileall -q dataload
      - name: Gerar dados em ambiente isolado
        run: docker compose -f docker-compose.test.yml run --build --rm dry-run

  report-ci:
    name: Reportar resultado do CI na PR
    if: always() && github.event_name == 'pull_request'
    needs:
      - smoke
    uses: delta-app-ofc/.github/.github/workflows/report_ci.yml@d30cc2161336efb9ed9d9b49524a373fe3cafd03
    with:
      needs_results: ${{ toJSON(needs) }}
    secrets:
      DELTA_ORG_AUTOMATION_TOKEN: ${{ secrets.DELTA_ORG_AUTOMATION_TOKEN }}
    permissions:
      actions: read
      issues: write
      pull-requests: write
